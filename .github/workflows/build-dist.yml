name: Build dist from dev

on:
  push:
    branches:
      - dev
    paths-ignore:
      - agent-knowledge/**

permissions:
  contents: write

concurrency:
  group: build-dist-main
  cancel-in-progress: false

jobs:
  build:
    name: Build dist from dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Checkout Yunzai
        uses: actions/checkout@v4
        with:
          repository: bling-yshs/Yunzai
          path: yunzai
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: yunzai/pnpm-lock.yaml

      - name: Copy plugin into Yunzai workspace
        run: rsync -a --delete --exclude='.git/' ./ yunzai/plugins/mhy-plugin/

      - name: Install Yunzai workspace dependencies
        working-directory: yunzai
        run: pnpm install --no-frozen-lockfile

      - name: Build plugin
        working-directory: yunzai
        run: pnpm --filter mhy-plugin run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: yunzai/plugins/mhy-plugin/dist
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Commit dist to main
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh main
        run: git pull --ff-only origin main

      - name: Clear existing dist
        run: rm -rf dist

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Commit dist
        env:
          DEV_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A --force dist
          if git diff --cached --quiet; then
            echo "dist is up to date"
            exit 0
          fi
          printf '%s\n' "$DEV_COMMIT_MESSAGE" > "$RUNNER_TEMP/commit-message"
          git commit -F "$RUNNER_TEMP/commit-message"
          git push origin HEAD:main
